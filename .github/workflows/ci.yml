name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: backend
      - name: Unit tests (pricing, tax, inventory)
        run: npm test

  api-integration:
    runs-on: ubuntu-latest
    needs: backend
    # Buoi 9 — bo hard-code: mat khau JWT/DB khong con viet cung nhieu noi.
    # CI dung tai khoan tam sinh trong container cua chinh run nay, nen gia tri
    # duoi day KHONG phai bi mat that. Van uu tien lay tu repository secret;
    # neu chua cau hinh secret thi dung chuoi throwaway ro rang ben canh.
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: workshop_user
      DB_NAME: workshop_test_db
      DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'ci_only_throwaway_not_a_real_secret' }}
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci_only_throwaway_jwt_secret_at_least_32_chars' }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workshop_user
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'ci_only_throwaway_not_a_real_secret' }}
          POSTGRES_DB: workshop_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workshop_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Run database migrations
        # Duong dan ket noi lap tu bien moi truong, khong ghi chuoi mat khau trong URL.
        run: |
          for f in database/migrations/*.sql; do
            psql "postgresql://$DB_USER:$DB_PASSWORD@localhost:$DB_PORT/$DB_NAME" -X -v ON_ERROR_STOP=1 -1 -f "$f"
          done
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Start server & smoke test health endpoint
        run: |
          node backend/src/server.js &
          sleep 3
          curl -sf http://localhost:3000/api/health
          echo " <- health OK"
      - name: Integration tests (repair, estimate and inventory workflows)
        run: npm run test:integration
